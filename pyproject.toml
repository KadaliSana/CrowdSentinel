[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sfcpi"
version = "0.1.0"
description = "SF-CPI: scale-free crowd pressure index from uncalibrated video"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "pandas",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sfcpi*"]
